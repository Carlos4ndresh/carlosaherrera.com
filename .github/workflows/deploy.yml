name: Deploy Hugo Site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  HUGO_VERSION: 0.165.0
  AWS_REGION: ca-central-1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build
        run: hugo --minify --gc

      - name: Validate build
        run: |
          if [ ! -f "public/index.html" ]; then
            echo "Error: public/index.html not found"
            exit 1
          fi

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 1200

      - name: Deploy to S3
        if: github.event_name != 'pull_request'
        run: |
          # Sync all files with long-lived cache
          aws s3 sync public/ s3://${{ secrets.S3_BUCKET_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --delete \
            --exact-timestamps \
            --exclude "*.DS_Store" \
            --cache-control "public, max-age=31536000"

          # Override HTML files with shorter cache so content updates propagate
          aws s3 cp public/ s3://${{ secrets.S3_BUCKET_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public, max-age=3600" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        if: github.event_name != 'pull_request'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Deployment summary
        if: github.event_name != 'pull_request'
        run: |
          echo "## Deployment complete" >> $GITHUB_STEP_SUMMARY
          echo "- Site: https://carlosaherrera.com" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${GITHUB_SHA::7}\`" >> $GITHUB_STEP_SUMMARY
