baseURL: https://www.carlosaherrera.com/
title: Carlos A. Herrera

module:
  imports:
    - path: github.com/jpanther/congo/v2

locale: en-us

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  colorScheme: congo
  defaultAppearance: dark
  autoSwitchAppearance: true

  header:
    layout: basic
    showTitle: true

  footer:
    showCopyright: true
    showThemeAttribution: false
    showAppearanceSwitcher: true
    showScrollToTop: true

  homepage:
    layout: profile
    showRecent: false

  article:
    showDate: false
    showAuthor: false
    showReadingTime: false
    showTableOfContents: false
    showPagination: false

  author:
    name: Carlos A. Herrera
    headline: Cloud Architect & DevOps Engineer
    links:
      - linkedin: https://www.linkedin.com/in/carlosandresherrera
      - github: https://github.com/Carlos4ndresh
      - email: mailto:contact@carlosaherrera.com

menus:
  main:
    - name: About
      url: /about/
      weight: 10

outputs:
  home:
    - HTML
    - RSS
    - JSON
